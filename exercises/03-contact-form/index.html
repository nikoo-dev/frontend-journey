<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <label for="name">სახელი:</label>
            <input type="name" name="name" id="name"
            placeholder="ნიკა" required>
            <label for="surname">გვარი:</label>
            <input type="surname" name="surname" id="surname"
            placeholder="ორაგველიძე" required>
        </fieldset>
        <fieldset>
            <label for="email">მეილი:</label>
            <input type="email" name="email" id="email"
            placeholder="NikaOragvelidze@gmail.com" required>
        </fieldset>
        <fieldset>
            <label for="subject">აირჩიე საგანი:</label>
            <select name="subject" id="subject" required>
                <option value="maths">მათემატიკა</option>
                <option value="english">ინგლისური</option>
                <option value="history">ისტორია</option>
                <option value="physics">ფიზიკა</option>
                <option value="chemistry">ქიმია</option>
            </select>

        </fieldset>
        <fieldset>
            <label for="message">ჩაწერე მესიჯი:</label>
            <input type="message" name="message" id="message">
        </fieldset>
        <fieldset>
            <button>Submit</button>
        </fieldset>
    </form>
    
</body>
</html>
